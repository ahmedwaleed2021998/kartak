name: Build Kartek APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true
      - name: Generate fixed keystore if not in repo (secure fallback)
        run: |
          if [ ! -f "android/app/upload-keystore.jks" ]; then
            echo "No keystore in repo (secure - not committed), generating temp fixed one via keytool..."
            mkdir -p android/app
            keytool -genkeypair -v -keystore android/app/upload-keystore.jks -storetype JKS -storepass kartak123 -alias kartak -keypass kartak123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=kartak, OU=Kartak, O=Kartak, L=Cairo, S=Cairo, C=EG" || echo "keytool failed, will use debug signing"
            echo "storePassword=kartak123" > android/key.properties
            echo "keyPassword=kartak123" >> android/key.properties
            echo "keyAlias=kartak" >> android/key.properties
            echo "storeFile=app/upload-keystore.jks" >> android/key.properties
            echo "Generated keystore via keytool"
          else
            echo "Found committed keystore"
          fi
          ls -lh android/app/upload-keystore.jks android/key.properties 2>&1 | head -5 || true
      - name: Generate Android project
        run: |
          cp android/app/google-services.json /tmp/google-services.json 2>/dev/null || true
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml 2>/dev/null || true
          cp -r android/app/src/main/res /tmp/res 2>/dev/null || true
          cp assets/images/logo.png /tmp/logo.png 2>/dev/null || true
          cp -r assets/images/cards /tmp/cards 2>/dev/null || true
          cp android/app/src/main/kotlin/com/kartak/kartak/MainActivity.kt /tmp/MainActivity.kt 2>/dev/null || true
          cp android/key.properties /tmp/key.properties 2>/dev/null || true
          cp android/app/upload-keystore.jks /tmp/upload-keystore.jks 2>/dev/null || true
          flutter create . --project-name kartak --org com.kartak --platforms android
          mkdir -p android/app/src/main
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp /tmp/google-services.json android/app/google-services.json 2>/dev/null || true
          mkdir -p android/app/src/main/res
          cp -r /tmp/res/* android/app/src/main/res/ 2>/dev/null || true
          cp /tmp/logo.png assets/images/logo.png 2>/dev/null || true
          mkdir -p assets/images/cards
          cp -r /tmp/cards/* assets/images/cards/ 2>/dev/null || true
          mkdir -p android/app/src/main/kotlin/com/kartak/kartak
          cp /tmp/MainActivity.kt android/app/src/main/kotlin/com/kartak/kartak/MainActivity.kt 2>/dev/null || true
          mkdir -p android
          cp /tmp/key.properties android/key.properties 2>/dev/null || true
          cp /tmp/upload-keystore.jks android/app/upload-keystore.jks 2>/dev/null || true
          echo "=== BEFORE fix ==="
          cat android/app/build.gradle | grep -E "applicationId|namespace" || true
          sed -i 's/applicationId "com\.kartak\.kartak"/applicationId "com.kartak.app"/g' android/app/build.gradle || true
          echo "=== AFTER fix ==="
          cat android/app/build.gradle | grep -E "applicationId|namespace" || true
          ls android/app/src/main/res/mipmap-*/ 2>/dev/null | head -20 || true
          echo "=== تفعيل تشفير R8/ProGuard - تصعيب فك التطبيق ==="
          # إنشاء proguard-rules.pro لو غير موجود
          cat > android/app/proguard-rules.pro << 'PROEOF'
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class io.flutter.util.** { *; }
          -keep class io.flutter.view.** { *; }
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -keep class com.google.firebase.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.firebase.**
          -dontwarn com.google.android.gms.**
          PROEOF
          # تفعيل minify و shrink في build.gradle
          if ! grep -q "minifyEnabled true" android/app/build.gradle; then
            sed -i 's/minifyEnabled false/minifyEnabled true/g' android/app/build.gradle || true
            if ! grep -q "minifyEnabled" android/app/build.gradle; then
              sed -i '/buildTypes {/{n;s/release {/release {\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile('\''proguard-android-optimize.txt'\''), '\''proguard-rules.pro'\''/}' android/app/build.gradle || true
            fi
          fi
          sed -i 's/shrinkResources false/shrinkResources true/g' android/app/build.gradle || true
          if ! grep -q "shrinkResources" android/app/build.gradle; then
            sed -i 's/minifyEnabled true/minifyEnabled true\n            shrinkResources true/' android/app/build.gradle || true
          fi
          cat android/app/build.gradle | grep -A2 -E "minifyEnabled|shrinkResources|proguardFiles" || true
          echo "=== إعداد توقيع ثابت لتقليل تحذير Play Protect ==="
          cat > /tmp/patch_build.py << 'PYEOF'
import pathlib
p = pathlib.Path("android/app/build.gradle")
t = p.read_text(encoding="utf-8")
if "signingConfigs" not in t:
    t = t.replace("android {", "android {\n    signingConfigs {\n        release {\n            keyAlias keystoreProperties['keyAlias']\n            keyPassword keystoreProperties['keyPassword']\n            storeFile file(keystoreProperties['storeFile'])\n            storePassword keystoreProperties['storePassword']\n        }\n    }")
    if "signingConfig signingConfigs.release" not in t:
        t = t.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }")
    p.write_text(t, encoding="utf-8")
    print("patched build.gradle")
PYEOF
          if [ -f "android/key.properties" ] && [ -f "android/app/upload-keystore.jks" ]; then
            echo "Found keystore, patching build.gradle"
            if ! grep -q "keystoreProperties" android/app/build.gradle; then
              sed -i '1i def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }' android/app/build.gradle
            fi
            if ! grep -q "signingConfigs" android/app/build.gradle; then
              python3 /tmp/patch_build.py
            fi
            cat android/app/build.gradle | grep -A8 "signingConfigs" || true
          else
            echo "No keystore found, build will use debug signing"
          fi
          echo "=== Manifest usesCleartextTraffic ==="
          sed -i 's/<application/<application android:usesCleartextTraffic="false"/' android/app/src/main/AndroidManifest.xml || true
          sed -i 's/android:usesCleartextTraffic="false" android:usesCleartextTraffic="false"/android:usesCleartextTraffic="false"/' android/app/src/main/AndroidManifest.xml || true
          cat android/app/src/main/AndroidManifest.xml | grep usesCleartextTraffic || true
      - name: Install deps
        run: flutter pub get
      - name: Generate launcher icons from logo.png (PIL fallback)
        run: |
          if [ ! -f "assets/images/logo.png" ]; then echo "no logo"; exit 0; fi
          echo "Generating launcher icons via Python PIL"
          pip install pillow -q
          cat > /tmp/gen_icons.py << 'PY'
          from PIL import Image
          import pathlib
          src = pathlib.Path('assets/images/logo.png')
          im = Image.open(src).convert('RGBA')
          sizes = {'mipmap-mdpi':48, 'mipmap-hdpi':72, 'mipmap-xhdpi':96, 'mipmap-xxhdpi':144, 'mipmap-xxxhdpi':192}
          base = pathlib.Path('android/app/src/main/res')
          for name, size in sizes.items():
              d = base / name
              d.mkdir(parents=True, exist_ok=True)
              resized = im.resize((size, size), Image.LANCZOS)
              resized.save(d / 'launcher_icon.png', 'PNG')
              resized.save(d / 'ic_launcher.png', 'PNG')
              print(name, size, 'ok')
          PY
          python3 /tmp/gen_icons.py
          ls android/app/src/main/res/mipmap-*/launcher_icon.png 2>/dev/null | head -10 || true
          cat android/app/src/main/AndroidManifest.xml | grep icon || true
      - name: Build APK (release) - مشفر - app-release فقط
        run: flutter build apk --release --obfuscate --split-debug-info=./symbols
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kartek-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
