name: Build Kartek APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true
      - name: Generate Android project
        run: |
          # يحافظ على google-services.json
          cp android/app/google-services.json /tmp/google-services.json 2>/dev/null || true
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml 2>/dev/null || true
          flutter create . --project-name kartak --org com.kartak --platforms android --no-pub
          mkdir -p android/app/src/main
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp /tmp/google-services.json android/app/google-services.json 2>/dev/null || true
          # ضبط applicationId ليطابق Firebase com.kartak.app
          sed -i 's/applicationId "com.kartak.kartak"/applicationId "com.kartak.app"/' android/app/build.gradle 2>/dev/null || true
          sed -i 's/namespace "com.kartak.kartak"/namespace "com.kartak.app"/' android/app/build.gradle 2>/dev/null || true
          cat android/app/build.gradle | grep -A2 applicationId || true
      - name: Install deps
        run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi
      - name: Build APK universal
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kartek-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
