name: kartek
description: كروت وشحن - شحن رصيد فودافون وكروت جميع الشبكات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  url_launcher: ^6.2.5
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  device_info_plus: ^9.1.2
  crypto: ^3.0.3
  firebase_app_check: ^0.2.1
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/cards/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#0f172a"
    theme_color: "#e11d48"
